name: Refresh Public Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 16 * * *"

permissions:
  contents: write
  issues: read
  actions: read

jobs:
  refresh-public-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Refresh feedback metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_feedback_metrics.py
      - name: Refresh adoption metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_adoption_metrics.py
      - name: Refresh GitHub traffic snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_github_traffic_snapshot.py
      - name: Refresh GitHub public stats snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_github_public_stats_snapshot.py
      - name: Rebuild traction artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_github_discovery_profile.py
          python scripts/build_star_growth_kit.py
          python scripts/build_business_impact_ledger.py
          python scripts/build_reviewer_funnel_board.py
          python scripts/build_reviewer_invitation_kit.py
          python scripts/build_reviewer_evidence_kit.py
          python scripts/build_resume_traction_proof.py
          python scripts/build_reviewer_action_queue.py
          python scripts/build_reviewer_outreach_execution_pack.py
          python scripts/build_external_reviewer_evidence_gate.py
          python scripts/build_accepted_evidence_rollup.py
          python scripts/build_resume_outcome_adjudication.py
          python scripts/build_resume_outcome_metrics.py
          python scripts/build_resume_outcome_action_checklist.py
          python scripts/build_reviewer_submission_hub.py
          python scripts/build_first_10_reviewer_sprint.py
          python scripts/build_pilot_evidence_quicklink.py
          python scripts/build_pilot_launch_control_room.py
          python scripts/build_public_launch_broadcast.py
          python scripts/build_outcome_pipeline_board.py
          python scripts/build_outcome_badges.py
          python scripts/build_public_reviewer_call.py
          python scripts/build_reviewer_share_kit.py
          python scripts/build_reviewer_outreach_status_board.py
          python scripts/build_outcome_collection_page.py
          python scripts/build_resume_claim_upgrade_ledger.py
          python scripts/build_resume_outcome_scoreboard.py
          python scripts/build_reviewer_send_queue.py
          python scripts/build_first_reviewer_send_kit.py
          python scripts/build_reviewer_quickstart_router.py
          python scripts/build_ai_engineer_reviewer_card.py
          python scripts/build_agent_maturity_audit.py
          python scripts/build_llm_agent_checklist_verdict.py
          python scripts/build_evidence_acceptance_checklist.py
          python scripts/build_first_external_review_card.py
          python scripts/build_first_feedback_conversion_runbook.py
          python scripts/build_first_reviewer_handoff.py
          python scripts/build_public_metrics_provenance.py
          python scripts/build_public_metrics_summary.py
          python scripts/build_live_project_scorecard.py
          python scripts/build_launch_evidence_snapshot.py
          python scripts/build_application_evidence_pack.py
      - name: Verify resume evidence
        run: |
          python scripts/verify_outcome_evidence.py
          python -m pytest tests/test_outcome_badges.py tests/test_ai_engineer_reviewer_card.py tests/test_agent_maturity_audit.py tests/test_launch_evidence_snapshot.py tests/test_github_public_stats_snapshot.py tests/test_github_discovery_profile.py tests/test_pilot_evidence_quicklink.py tests/test_pilot_launch_control_room.py tests/test_public_launch_broadcast.py tests/test_outcome_pipeline_board.py tests/test_resume_outcome_adjudication.py tests/test_first_10_reviewer_sprint.py tests/test_star_growth_kit.py tests/test_public_metrics_provenance.py tests/test_public_metrics_summary.py tests/test_business_impact_ledger.py tests/test_reviewer_evidence_kit.py tests/test_resume_traction_proof.py tests/test_reviewer_action_queue.py tests/test_reviewer_outreach_execution_pack.py tests/test_reviewer_outreach_status_board.py tests/test_record_reviewer_outreach_event.py tests/test_resume_outcome_metrics.py tests/test_resume_outcome_action_checklist.py tests/test_reviewer_submission_hub.py tests/test_public_reviewer_call.py tests/test_reviewer_share_kit.py tests/test_outcome_collection_page.py tests/test_resume_claim_upgrade_ledger.py tests/test_resume_outcome_scoreboard.py tests/test_reviewer_send_queue.py tests/test_first_reviewer_send_kit.py tests/test_reviewer_quickstart_router.py tests/test_first_external_review_card.py tests/test_first_feedback_conversion_runbook.py tests/test_evidence_acceptance_checklist.py tests/test_first_reviewer_handoff.py
      - name: Commit refreshed metrics
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh public metrics"
          file_pattern: docs/*.json docs/*.jsonl docs/*.md docs/*.html
