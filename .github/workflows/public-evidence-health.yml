name: Public Evidence Health

on:
  workflow_dispatch:
  schedule:
    - cron: "23 15 * * *"
  push:
    paths:
      - ".github/workflows/public-evidence-health.yml"
      - "docs/**"
      - "scripts/verify_public_evidence_health.py"
      - "tests/test_public_evidence_health.py"
  pull_request:
    paths:
      - ".github/workflows/public-evidence-health.yml"
      - "docs/**"
      - "scripts/verify_public_evidence_health.py"
      - "tests/test_public_evidence_health.py"

jobs:
  public-evidence-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public evidence URLs
        run: python scripts/verify_public_evidence_health.py
      - name: Upload public evidence health artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-evidence-health
          path: docs/public-evidence-health.json
