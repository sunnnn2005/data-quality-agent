name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run deterministic test suite
        run: python -m pytest
      - name: Verify support-ticket demo result
        run: python scripts/verify_support_ticket_demo.py
      - name: Verify adoption metrics artifact
        env:
          ADOPTION_STARS: "0"
          ADOPTION_FORKS: "1"
          ADOPTION_WATCHERS: "0"
          ADOPTION_ISSUES_TOTAL: "10"
        run: python scripts/update_adoption_metrics.py
