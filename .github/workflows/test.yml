name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run deterministic test suite
        run: python -m pytest
      - name: Verify support-ticket demo result
        run: python scripts/verify_support_ticket_demo.py
      - name: Verify business impact artifact
        run: python scripts/verify_business_impact.py
      - name: Verify evaluation summary artifact
        run: python scripts/build_eval_summary.py
      - name: Verify hypothesis feedback artifact
        run: python scripts/build_hypothesis_feedback.py
      - name: Verify incident pattern memory artifact
        run: python scripts/build_incident_pattern_memory.py
      - name: Verify agent observability artifact
        run: python scripts/build_agent_observability.py
      - name: Verify agent safety boundaries artifact
        run: python scripts/build_agent_safety_boundaries.py
      - name: Verify real model runbook artifact
        run: python scripts/build_real_model_runbook.py
      - name: Verify real model evidence capture artifact
        run: python scripts/build_real_model_evidence_capture.py
      - name: Verify local reviewer demo artifact
        run: python scripts/build_local_reviewer_demo.py
      - name: Verify runnable release packet
        run: python scripts/build_runnable_release_packet.py
      - name: Verify external run evidence packet
        run: python scripts/build_external_run_evidence_packet.py
      - name: Verify external reviewer request pack
        run: python scripts/build_external_reviewer_request_pack.py
      - name: Verify external run quickstart page
        run: python scripts/build_external_run_quickstart_page.py
      - name: Verify external reviewer outreach tracker
        run: python scripts/build_external_reviewer_outreach_tracker.py
      - name: Verify external reviewer evidence gate
        run: python scripts/build_external_reviewer_evidence_gate.py
      - name: Verify first accepted evidence examples
        run: python scripts/build_first_accepted_evidence_examples.py
      - name: Verify accepted evidence rollup
        run: python scripts/build_accepted_evidence_rollup.py
      - name: Verify API smoke report artifact
        run: python scripts/build_api_smoke_report.py

      - name: Verify performance baseline artifact
        run: python scripts/build_performance_baseline.py

      - name: Verify demo usage baseline artifact
        run: python scripts/build_demo_usage_baseline.py
      - name: Verify business data intake baseline artifact
        run: python scripts/build_business_data_intake_baseline.py
      - name: Verify business replay demo artifact
        run: python scripts/build_business_replay_demo.py
      - name: Verify community growth baseline artifact
        run: python scripts/build_community_growth_baseline.py
      - name: Verify impact review packet artifact
        run: python scripts/build_impact_review_packet.py
      - name: Verify business problem casebook artifact
        run: python scripts/build_business_problem_casebook.py
      - name: Verify business impact validation plan
        run: python scripts/build_business_impact_validation_plan.py
      - name: Verify public traction dashboard artifact
        run: python scripts/build_public_traction_dashboard.py
      - name: Verify live project scorecard
        run: python scripts/build_live_project_scorecard.py
      - name: Verify recruiter pitch artifact
        run: python scripts/build_recruiter_pitch.py
      - name: Verify application evidence pack
        run: python scripts/build_application_evidence_pack.py
      - name: Verify pilot outreach kit
        run: python scripts/build_pilot_outreach_kit.py
      - name: Verify pilot program plan
        run: python scripts/build_pilot_program_plan.py
      - name: Verify pilot review tracker
        run: python scripts/build_pilot_review_tracker.py
      - name: Verify pilot conversion board
        run: python scripts/build_pilot_conversion_board.py
      - name: Verify resume outcome readiness
        run: python scripts/evaluate_resume_outcomes.py
      - name: Verify resume outcome adjudication
        run: python scripts/build_resume_outcome_adjudication.py
      - name: Verify external review evidence ledger
        run: python scripts/build_external_review_evidence_ledger.py
      - name: Verify GitHub traffic snapshot
        run: python scripts/build_github_traffic_snapshot.py
      - name: Verify GitHub public stats snapshot
        run: python scripts/build_github_public_stats_snapshot.py
      - name: Verify GitHub discovery profile
        run: python scripts/build_github_discovery_profile.py
      - name: Verify pilot evidence quicklink
        run: python scripts/build_pilot_evidence_quicklink.py
      - name: Verify pilot launch control room
        run: python scripts/build_pilot_launch_control_room.py
      - name: Verify public availability snapshot
        run: python scripts/build_public_availability_snapshot.py
      - name: Verify launch evidence snapshot
        run: python scripts/build_launch_evidence_snapshot.py
      - name: Verify public launch broadcast
        run: python scripts/build_public_launch_broadcast.py
      - name: Verify outcome pipeline board
        run: python scripts/build_outcome_pipeline_board.py
      - name: Verify outcome badges
        run: python scripts/build_outcome_badges.py
      - name: Verify AI Engineer reviewer card
        run: python scripts/build_ai_engineer_reviewer_card.py
      - name: Verify outcome upgrade playbook
        run: python scripts/build_outcome_upgrade_playbook.py
      - name: Verify reviewer feedback packet
        run: python scripts/build_reviewer_feedback_packet.py
      - name: Verify reviewer funnel board
        run: python scripts/build_reviewer_funnel_board.py
      - name: Verify reviewer invitation kit
        run: python scripts/build_reviewer_invitation_kit.py
      - name: Verify reviewer outcome sprint calendar
        run: python scripts/build_reviewer_outcome_sprint_calendar.py
      - name: Verify reviewer outcome ledger
        run: python scripts/build_reviewer_outcome_ledger.py
      - name: Verify public outcome intake dashboard
        run: python scripts/build_public_outcome_intake_dashboard.py
      - name: Verify reviewer landing page
        run: python scripts/verify_reviewer_landing_page.py
      - name: Verify feedback intake quality
        run: python scripts/build_feedback_intake_quality.py
      - name: Verify business case intake
        run: python scripts/build_business_case_intake.py
      - name: Verify first reviewer handoff
        run: python scripts/build_first_reviewer_handoff.py
      - name: Verify first reviewer send kit
        run: python scripts/build_first_reviewer_send_kit.py
      - name: Verify OpenAPI contract artifact
        run: python scripts/build_openapi_artifact.py
      - name: Verify feedback metrics artifact
        env:
          FEEDBACK_ITEMS: "0"
          CONFIRMED_EXTERNAL_USERS: "0"
          REPRODUCIBLE_FEEDBACK_ITEMS: "0"
          BUG_FEEDBACK_ITEMS: "0"
          FEATURE_FEEDBACK_ITEMS: "8"
          BUSINESS_CASE_FEEDBACK_ITEMS: "0"
          AI_ENGINEER_REVIEW_ITEMS: "0"
        run: python scripts/update_feedback_metrics.py
      - name: Verify adoption metrics artifact
        env:
          ADOPTION_STARS: "0"
          ADOPTION_FORKS: "1"
          ADOPTION_WATCHERS: "0"
          ADOPTION_ISSUES_TOTAL: "25"
          ADOPTION_TEST_COUNT: "187"
        run: python scripts/update_adoption_metrics.py
      - name: Verify public metrics provenance
        run: python scripts/build_public_metrics_provenance.py
      - name: Verify outcome evidence manifest
        run: python scripts/verify_outcome_evidence.py
      - name: Verify public evidence health contract
        run: python -m pytest tests/test_public_evidence_health.py
