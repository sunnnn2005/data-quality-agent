services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quality_demo
      POSTGRES_USER: quality_owner
      POSTGRES_PASSWORD: quality_owner
    ports:
      - "5433:5432"
    volumes:
      - ./examples/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quality_owner -d quality_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      ENABLE_POSTGRES_ADAPTER: "true"
      POSTGRES_DSN: postgresql://readonly_agent:readonly_agent@postgres:5432/quality_demo
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
